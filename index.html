  <style>
    html {
      overflow-y: scroll;
      scrollbar-gutter: stable;
    }

    body {
      margin: 0;
      padding: 28px;
      background: #f4f6f8;
      color: #111827;
      font-family: "Segoe UI", "Malgun Gothic", Arial, sans-serif;
      letter-spacing: 0;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #d8dee6;
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .desc {
      margin: 0 0 22px;
      color: #4b5563;
      line-height: 1.6;
    }

    .table-slot {
      width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background: #fff;
    }

    col.col-type { width: 11%; }
    col.col-version { width: 6%; }
    col.col-note { width: 67%; }
    col.col-file { width: 16%; }

    th, td {
      border: 1px solid #d8dee6;
      padding: 12px;
      text-align: left;
      vertical-align: middle;
      font-size: 14px;
    }

    th {
      background: #f1f5f9;
      font-weight: 700;
    }

    .tag {
      display: inline-block;
      min-width: 54px;
      padding: 5px 8px;
      border-radius: 999px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      background: #e5e7eb;
      color: #374151;
    }

    .tag.latest {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .tag.stable {
      background: #dcfce7;
      color: #047857;
    }

    .tag.test {
      background: #fef3c7;
      color: #92400e;
    }

    a.download {
      display: inline-block;
      min-width: 92px;
      padding: 8px 12px;
      border-radius: 6px;
      background: #0ea5e9;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
    }

    a.download:hover {
      background: #0284c7;
    }

    .empty {
      padding: 18px;
      border: 1px solid #d8dee6;
      background: #fff;
      color: #6b7280;
    }

    .pagination {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 18px;
    }

    .pagination button {
      min-width: 38px;
      height: 38px;
      padding: 0 10px;
      border: 1px solid #d8dee6;
      border-radius: 6px;
      background: #fff;
      color: #374151;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .pagination button:hover:not(:disabled):not(.active) {
      background: #f1f5f9;
    }

    .pagination button.active {
      border-color: #0ea5e9;
      background: #0ea5e9;
      color: #fff;
      cursor: default;
    }

    .pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    @media (max-width: 680px) {
      body { padding: 12px; }
      main { padding: 16px; }
      .table-slot { min-height: 0 !important; }
      table { table-layout: auto; }
      colgroup { display: none; }
      table, thead, tbody, tr, th, td { display: block; }
      thead { display: none; }
      tr { border: 1px solid #d8dee6; margin-bottom: 10px; }
      td { border: 0; border-bottom: 1px solid #eef2f7; }
      td:last-child { border-bottom: 0; }
      td::before {
        content: attr(data-label);
        display: block;
        margin-bottom: 4px;
        color: #6b7280;
        font-size: 12px;
        font-weight: 700;
      }
      a.download { width: 100%; }
    }
  </style>
</head>

      },
      {

        // note: "\uBB38\uC81C\uAC00 \uC788\uC744 \uB54C \uB418\uB3CC\uB9B4 \uC218 \uC788\uB294 \uBC31\uC5C5 \uBC84\uC804\uC785\uB2C8\uB2E4.",
        note: "안정된 버전: 문제가 있을 때 되돌릴 수 있는 백업 버전입니다.",
        file: "https://github.com/SugarRush1231/Multi_Media_Toolkit/releases/download/v1.2.2/MMT_Setup_v1.2.2.exe"
      },
      {

        note: "문제가 있을 때 되돌릴 수 있는 백업 버전입니다.",
        file: "https://github.com/SugarRush1231/Multi_Media_Toolkit/releases/download/v1.2.1/MMT_Setup_v1.2.1.exe"
      },
      {

        version: "1.2.0",
        // note: "\uC548\uC815 \uBC84\uC804\uC774 \uD544\uC694\uD560 \uB54C \uBC1B\uC744 \uC218 \uC788\uB294 \uC608\uC804 \uBC84\uC804\uC785\uB2C8\uB2E4.",

      },

      },
      {

        // note: "\uC548\uC815 \uBC84\uC804\uC774 \uD544\uC694\uD560 \uB54C \uBC1B\uC744 \uC218 \uC788\uB294 \uC608\uC804 \uBC84\uC804\uC785\uB2C8\uB2E4.",
        note: "문제가 많은 초창기 버전입니다.",
        file: "https://github.com/SugarRush1231/Multi_Media_Toolkit/releases/download/v1.0.9/MMT_Setup_v1.0.9.exe"

      {

       {

        // note: "\uC548\uC815 \uBC84\uC804\uC774 \uD544\uC694\uD560 \uB54C \uBC1B\uC744 \uC218 \uC788\uB294 \uC608\uC804 \uBC84\uC804\uC785\uB2C8\uB2E4.",
        note: "문제가 많은 초창기 버전입니다.",
        file: "https://github.com/SugarRush1231/Multi_Media_Toolkit/releases/download/v1.0.5/MMT_Setup_v1.0.5.exe"
      },

      {
        type: "backup",
        version: "1.0.3",
        // note: "\uC548\uC815 \uBC84\uC804\uC774 \uD544\uC694\uD560 \uB54C \uBC1B\uC744 \uC218 \uC788\uB294 \uC608\uC804 \uBC84\uC804\uC785\uB2C8\uB2E4.",
        note: "문제가 많은 초창기 버전입니다.",
        file: "https://github.com/SugarRush1231/Multi_Media_Toolkit/releases/download/v1.0.3/MMT_Setup_v1.0.3.exe"
      },
    ];

    function tagClass(type) {
      if (type === "latest") return "latest";
      if (type === "stable") return "stable";
      if (type === "test") return "test";
      return "";
    }

    function tagText(type) {
      if (type === "latest") return "\uCD5C\uC2E0";
      if (type === "stable") return "\uC548\uC815";
      if (type === "test") return "\uD14C\uC2A4\uD2B8";
      if (type === "backup") return "\uBC31\uC5C5";
      return "\uAE30\uD0C0";
    }

    const ITEMS_PER_PAGE = 10;
    const PAGE_BUTTONS_PER_GROUP = 10;
    let currentPage = 1;
    let fullPageTableHeight = 0;

    function sortByNewest(items) {
      return [...items].sort((a, b) =>
        String(b.version || "").localeCompare(String(a.version || ""), undefined, {
          numeric: true,
          sensitivity: "base"
        })
      );
    }

    const versions = sortByNewest(
      Array.isArray(window.MMT_VERSIONS) ? window.MMT_VERSIONS : DEFAULT_VERSIONS
    );

    function render(page = 1) {
      if (!versions.length) {
        area.className = "empty";
        area.textContent = "\uB4F1\uB85D\uB41C \uB2E4\uC6B4\uB85C\uB4DC \uD30C\uC77C\uC774 \uC5C6\uC2B5\uB2C8\uB2E4.";
        return;
      }

      const totalPages = Math.ceil(versions.length / ITEMS_PER_PAGE);
      currentPage = Math.min(Math.max(page, 1), totalPages);

      const start = (currentPage - 1) * ITEMS_PER_PAGE;
      const pageItems = versions.slice(start, start + ITEMS_PER_PAGE);

      area.className = "";
      area.innerHTML = `
        <div class="table-slot">
        <table>
          <colgroup>
            <col class="col-type">
            <col class="col-version">
            <col class="col-note">
            <col class="col-file">
          </colgroup>
          <thead>
            <tr>
              <th>\uAD6C\uBD84</th>
              <th>\uBC84\uC804</th>
              <th>\uC124\uBA85</th>
              <th>\uD30C\uC77C</th>
            </tr>
          </thead>
          <tbody>
            ${pageItems.map(item => `
              <tr>
                <td data-label="\uAD6C\uBD84"><span class="tag ${tagClass(item.type)}">${tagText(item.type)}</span></td>
                <td data-label="\uBC84\uC804">${item.version || "-"}</td>
                <td data-label="\uC124\uBA85">${item.note || ""}</td>
                <td data-label="\uD30C\uC77C"><a class="download" href="${item.file || "#"}">\uB2E4\uC6B4\uB85C\uB4DC</a></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
        </div>
        ${renderPagination(totalPages)}
      `;

      syncTableSlotHeight(pageItems);

      area.querySelectorAll("[data-page]").forEach(button => {
        button.addEventListener("click", () => {
          render(Number(button.dataset.page));
        });
      });
    }

    function syncTableSlotHeight(pageItems) {
      const slot = area.querySelector(".table-slot");
      const table = slot ? slot.querySelector("table") : null;

      if (!slot || !table) return;

      if (window.innerWidth <= 680) {
        slot.style.minHeight = "";
        return;
      }

      const tableHeight = Math.ceil(table.getBoundingClientRect().height);

      // 10개가 꽉 찬 페이지의 표 높이를 기준 높이로 기억합니다.
      if (pageItems.length === ITEMS_PER_PAGE) {
        fullPageTableHeight = Math.max(fullPageTableHeight, tableHeight);
      }

      if (fullPageTableHeight > 0) {
        slot.style.minHeight = `${fullPageTableHeight}px`;
      }
    }

    function renderPagination(totalPages) {
      if (totalPages <= 1) return "";

      const groupStart = Math.floor((currentPage - 1) / PAGE_BUTTONS_PER_GROUP) * PAGE_BUTTONS_PER_GROUP + 1;
      const groupEnd = Math.min(groupStart + PAGE_BUTTONS_PER_GROUP - 1, totalPages);
      const pageCount = groupEnd - groupStart + 1;

      const pageButtons = Array.from({ length: pageCount }, (_, index) => {
        const page = groupStart + index;
        return `
          <button type="button" data-page="${page}" class="${page === currentPage ? "active" : ""}" ${page === currentPage ? 'aria-current="page"' : ""}>
            ${page}
          </button>
        `;
      }).join("");

      const previousGroupPage = Math.max(1, groupStart - 1);
      const nextGroupPage = groupEnd + 1;

      return `
        <nav class="pagination" aria-label="\uD398\uC774\uC9C0 \uC774\uB3D9">
          <button type="button" data-page="${previousGroupPage}" ${groupStart === 1 ? "disabled" : ""}>\uC774\uC804</button>
          ${pageButtons}
          <button type="button" data-page="${nextGroupPage}" ${groupEnd === totalPages ? "disabled" : ""}>\uB2E4\uC74C</button>
        </nav>
      `;
    }

    render(1);
  </script>
</body>
</html>
